<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E0609A">
<meta name="description" content="LGS günlük soru takip çizelgesi">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>LGS Takip Çizelgem 🌸</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<canvas id="confetti" aria-hidden="true"></canvas>

<!-- ============ KİLİT EKRANI ============ -->
<section id="lock" class="lock">
  <div class="lock-card" id="lockCard">
    <div class="lock-emoji">🌸</div>
    <h1 class="lock-title">LGS Takip Çizelgem</h1>
    <p class="lock-sub" id="lockSub">Şifreni gir de başlayalım ✨</p>

    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="keypad" id="keypad">
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" class="ghost" data-k="clear">C</button>
      <button type="button" data-k="0">0</button>
      <button type="button" class="ghost" data-k="del">⌫</button>
    </div>
  </div>
</section>

<!-- ============ İSİM SORMA ============ -->
<section id="onboard" class="lock hidden">
  <div class="lock-card">
    <div class="lock-emoji">👋</div>
    <h1 class="lock-title">Merhaba!</h1>
    <p class="lock-sub">Sana nasıl seslenelim?</p>
    <input id="onboardName" class="big-input" type="text" placeholder="Adın..." maxlength="18" autocomplete="off">
    <button id="onboardGo" class="btn-primary wide">Hadi başlayalım 🚀</button>
  </div>
</section>

<!-- ============ HOŞ GELDİN ============ -->
<section id="welcome" class="lock hidden">
  <div class="welcome-card">
    <div class="sparkles" aria-hidden="true">✨</div>
    <div class="photo-frame">
      <img id="welcomePhoto" src="assets/p-e436ab9d.jpg" alt="Sınav masasında Dobby kostümlü öğrenci ve arkasında ona destek olan ablası/abisi" loading="eager">
      <div class="photo-tape"></div>
    </div>
    <h1 class="welcome-title" id="welcomeTitle">Hoş geldin!</h1>
    <p class="welcome-quote" id="welcomeQuote"></p>
    <div class="welcome-count" id="welcomeCount"></div>
    <button id="welcomeGo" class="btn-primary wide">Hadi başlayalım 🚀</button>
  </div>
</section>

<!-- ============ UYGULAMA ============ -->
<div id="app" class="app hidden">

  <aside class="side" id="sideNav" aria-label="Menü">
    <div class="side-logo" aria-hidden="true">🌸</div>
    <nav class="side-nav">
      <button type="button" data-tab="today" aria-label="Bugün"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><em>Bugün</em></button>
      <button type="button" data-tab="week" aria-label="Çizelge"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 13.5h3M13.5 13.5h3M7.5 17h3"/></svg><em>Çizelge</em></button>
      <button type="button" data-tab="books" aria-label="Kitaplar"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h6a3.5 3.5 0 0 1 3.5 3.5v13a2.6 2.6 0 0 0-2.6-2.6H2.5z"/><path d="M21.5 4.5h-6A3.5 3.5 0 0 0 12 8v13a2.6 2.6 0 0 1 2.6-2.6h6.9z"/></svg><em>Kitaplar</em></button>
      <button type="button" data-tab="english" aria-label="İngilizce"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9.5L5 19.5v-4H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z"/><path d="m7 12.5 3-6 3 6M8 10.5h4"/><path d="M20 9.5h.5a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5H20v3l-3.5-3"/></svg><em>İngilizce</em></button>
      <button type="button" data-tab="badges" aria-label="Rozetler"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M12 6.5 13 8.6l2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z"/><path d="m8.6 14.2-1.6 7.8 5-2.6 5 2.6-1.6-7.8"/></svg><em>Rozetler</em></button>
      <button type="button" data-tab="stats" aria-label="İstatistik"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m7 15 4-4.5 3 3L20 7"/></svg><em>İstatistik</em></button>
      <button type="button" data-tab="exams" aria-label="Denemeler"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10v5.5a5 5 0 0 1-10 0z"/><path d="M7 5.5H4.5a3 3 0 0 0 3 4.4M17 5.5h2.5a3 3 0 0 1-3 4.4M12 14v3.5M8 21h8M9.5 17.5h5"/></svg><em>Denemeler</em></button>
    </nav>
    <div class="side-foot">
      <button type="button" data-tab="settings" aria-label="Ayarlar"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.9-1.9M17.5 6.5l1.9-1.9"/></svg><em>Ayarlar</em></button>
      <button type="button" id="sideLock" aria-label="Kilitle"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="11" rx="3"/><path d="M8 10.5V7.2a4 4 0 0 1 8 0v3.3M12 15v2.5"/></svg><em>Kilitle</em></button>
    </div>
  </aside>

  <div class="panel" id="panel">
  <header class="topbar">
    <div class="topbar-in">
      <div class="hello">
        <div class="hello-text" id="greeting">Merhaba!</div>
        <div class="hello-date" id="todayLabel"></div>
      </div>
      <div class="top-badges">
        <div class="chip chip-fire" id="streakChip" title="Üst üste çalıştığın gün">🔥 <b>0</b></div>
        <div class="chip chip-count" id="countdownChip" title="LGS'ye kalan gün">⏳ <b>-</b></div>
        <div class="chip chip-sync hidden" id="syncChip" title="Bulut eşitleme">☁️</div>
        <button type="button" class="chip chip-gift hidden" id="giftChip" title="Hediye sepetin" aria-label="Hediye sepeti">🧺 <b>0</b></button>
        <button type="button" class="chip chip-gear" id="gearBtn" title="Ayarlar" aria-label="Ayarlar">⚙️</button>
      </div>
    </div>
    <div class="level-wrap">
      <div class="level-row">
        <span class="level-name" id="levelName">Seviye 1</span>
        <span class="level-xp" id="levelXp">0 / 40 XP</span>
      </div>
      <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>
    </div>
  </header>

  <main id="view" class="view"></main>
  </div>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="today"><span>🌤️</span><i><b class="t-full">Bugün</b><b class="t-short">Bugün</b></i></button>
    <button type="button" data-tab="week"><span>🗓️</span><i><b class="t-full">Çizelge</b><b class="t-short">Çizelge</b></i></button>
    <button type="button" data-tab="books"><span>📚</span><i><b class="t-full">Kitaplar</b><b class="t-short">Kitap</b></i></button>
    <button type="button" data-tab="english"><span>🔤</span><i><b class="t-full">İngilizce</b><b class="t-short">İng</b></i></button>
    <button type="button" data-tab="badges"><span>🏅</span><i><b class="t-full">Rozetler</b><b class="t-short">Rozet</b></i></button>
    <button type="button" data-tab="stats"><span>📈</span><i><b class="t-full">İstatistik</b><b class="t-short">İstat</b></i></button>
    <button type="button" data-tab="exams"><span>🏆</span><i><b class="t-full">Denemeler</b><b class="t-short">Deneme</b></i></button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
