<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF0F5">
<meta name="description" content="LGS günlük soru takip çizelgesi">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>LGS Takip Çizelgem 🌸</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="petals" id="petals" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<!-- ============ KİLİT EKRANI ============ -->
<section id="lock" class="lock">
  <div class="lock-card" id="lockCard">
    <div class="lock-emoji">🌸</div>
    <h1 class="lock-title">LGS Takip Çizelgem</h1>
    <p class="lock-sub" id="lockSub">Şifreni gir de başlayalım ✨</p>

    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="keypad" id="keypad">
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" class="ghost" data-k="clear">C</button>
      <button type="button" data-k="0">0</button>
      <button type="button" class="ghost" data-k="del">⌫</button>
    </div>
  </div>
</section>

<!-- ============ İSİM SORMA ============ -->
<section id="onboard" class="lock hidden">
  <div class="lock-card">
    <div class="lock-emoji">👋</div>
    <h1 class="lock-title">Merhaba!</h1>
    <p class="lock-sub">Sana nasıl seslenelim?</p>
    <input id="onboardName" class="big-input" type="text" placeholder="Adın..." maxlength="18" autocomplete="off">
    <button id="onboardGo" class="btn-primary wide">Hadi başlayalım 🚀</button>
  </div>
</section>

<!-- ============ HOŞ GELDİN ============ -->
<section id="welcome" class="lock hidden">
  <div class="welcome-card">
    <div class="sparkles" aria-hidden="true">✨</div>
    <div class="photo-frame">
      <img id="welcomePhoto" src="assets/p-e436ab9d.jpg" alt="Sınav masasında Dobby kostümlü öğrenci ve arkasında ona destek olan ablası/abisi" loading="eager">
      <div class="photo-tape"></div>
    </div>
    <h1 class="welcome-title" id="welcomeTitle">Hoş geldin!</h1>
    <p class="welcome-quote" id="welcomeQuote"></p>
    <div class="welcome-count" id="welcomeCount"></div>
    <button id="welcomeGo" class="btn-primary wide">Hadi başlayalım 🚀</button>
  </div>
</section>

<!-- ============ UYGULAMA ============ -->
<div id="app" class="app hidden">

  <header class="topbar">
    <div class="topbar-in">
      <div class="hello">
        <div class="hello-text" id="greeting">Merhaba!</div>
        <div class="hello-date" id="todayLabel"></div>
      </div>
      <div class="top-badges">
        <div class="chip chip-fire" id="streakChip" title="Üst üste çalıştığın gün">🔥 <b>0</b></div>
        <div class="chip chip-count" id="countdownChip" title="LGS'ye kalan gün">⏳ <b>-</b></div>
        <div class="chip chip-sync hidden" id="syncChip" title="Bulut eşitleme">☁️</div>
      </div>
    </div>
    <div class="level-wrap">
      <div class="level-row">
        <span class="level-name" id="levelName">Seviye 1</span>
        <span class="level-xp" id="levelXp">0 / 40 XP</span>
      </div>
      <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="today"><span>🌤️</span><i>Bugün</i></button>
    <button type="button" data-tab="week"><span>🗓️</span><i>Çizelge</i></button>
    <button type="button" data-tab="stats"><span>📈</span><i>İstatistik</i></button>
    <button type="button" data-tab="exams"><span>🏆</span><i>Denemeler</i></button>
    <button type="button" data-tab="settings"><span>⚙️</span><i>Ayarlar</i></button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
